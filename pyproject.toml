[project]
name = "pkevolve"
version = "0.1.0"
description = "PKevolve: Knowledge Graph Curation"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "torch",
    "torch_geometric",
    "scikit-learn",
    "matplotlib",
    "numpy",
    "requests",
    "openai>=1.0.0",
    "paper-search-mcp>=0.1.3",
    "python-dotenv",
    "langchain-core>=1.1.1",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.4",
    "pymupdf>=1.23.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "jupyter_client>=8.6",
    "ipykernel>=6.0",
    "spacy>=3.0",
    "claude-agent-sdk",
    "sentence-transformers",
    "seaborn>=0.13.2",
    "litellm"
]

[project.optional-dependencies]
fulltext = [
    # INDRA for full-text retrieval via pmc_client + elsevier_client.
    # full_text.py gracefully skips Layer 2 if indra is not installed.
    "indra",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkevolve"]

[tool.uv]
# pysb 1.16.0 (only version) fails to build — its ez_setup.py downloads from a
# dead URL. We only use indra.literature, never pysb, so exclude it.
override-dependencies = ["pysb; python_version < '0'"]


