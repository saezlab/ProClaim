[project]
name = "proclaim"
version = "0.1.0"
description = "ProClaim: Sufficiency-Aware Evidence Programming for In-the-Wild Scientific Claim Verification"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "torch==2.6.0",
    "nvidia-cudnn-cu12; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torch_geometric",
    "scikit-learn",
    "matplotlib",
    "numpy",
    "requests",
    "openai>=1.0.0",
    "paper-search-mcp>=0.1.3",
    "python-dotenv",
    "langchain-core>=1.1.1",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.4",
    "pymupdf>=1.23.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "jupyter_client>=8.6",
    "ipykernel>=6.0",
    "spacy>=3.0",
    "claude-agent-sdk",
    "transformers>=4.46,<4.53",  # 4.53+ imports torch.float8_e8m0fnu (needs torch>=2.7); we pin torch==2.6.0
    "sentence-transformers",
    "en-core-sci-sm @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_sm-0.5.4.tar.gz",
    "seaborn>=0.13.2",
    "litellm[google]",
    "jupytext>=1.16",
    "langchain-community>=0.4.1",
    "langchain-litellm>=0.6.1",
    "ddgs>=9.14.2",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
fulltext = [
    # INDRA for full-text retrieval via pmc_client + elsevier_client.
    # full_text.py gracefully skips Layer 2 if indra is not installed.
    "indra",
]
baselines = [
    # DuckDuckGo search fallback for FIRE and ReAct baselines.
    "ddgs",
    # Google Cloud SDK for Vertex AI / Gemini models via LiteLLM.
    "litellm[google]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proclaim"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# pysb 1.16.0 (only version) fails to build — its ez_setup.py downloads from a
# dead URL. We only use indra.literature, never pysb, so exclude it.
override-dependencies = ["pysb; python_version < '0'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
nvidia-cudnn-cu12 = { index = "pytorch-cu124" }
nvidia-nccl-cu12 = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


