[project]
name = "pkevolve"
version = "0.1.0"
description = "PKevolve: Knowledge Graph Curation"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "torch",
    "torch_geometric",
    "scikit-learn",
    "matplotlib",
    "numpy",
    "requests",
    "openai>=1.0.0",
    "paper-search-mcp>=0.1.3",
    "python-dotenv",
    "langchain-core>=1.1.1",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.4",
    "pymupdf>=1.23.0",
    "pydantic>=2.0",
    "mcp>=1.0.0",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "jupyter_client>=8.6",
    "ipykernel>=6.0",
    "claude_agent_sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkevolve"]


