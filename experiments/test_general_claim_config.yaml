# ──────────────────────────────────────────────────────────────────────
# Test config for GENERAL claim verification (from SciFact dataset)
#
# This config uses a general biomedical claim from the SciFact dataset
# to test the evidence verification pipeline with general claims.
#
# Usage:
#   uv run python -m pkevolve.verification.evidence_programming \
#       --config experiments/test_general_claim_config.yaml \
#       --claim "A breast cancer patient's capacity to metabolize tamoxifen has no effect on treatment outcome."
#
# SciFact Claim ID: 29
# Claim Type: GENERAL (biomedical treatment outcome)
# Ground Truth: CONTRADICT (has evidence contradicting this claim)
# ──────────────────────────────────────────────────────────────────────

# Orchestration mode: "sdk" (Claude Agent SDK + nb_execute) or "repl"
mode: sdk

# Verification workflow parameters
max_iterations: 3
sufficiency_threshold: 0.80

# LLM configuration
llm:
  # Claude configuration (using official Anthropic API)
  model: claude-sonnet-4-20250514  # Claude Sonnet 4 (or claude-sonnet-4-5-20250929 for latest)
  agent_base_url: "https://api.anthropic.com" # Official Anthropic API endpoint

  # GLM configuration (commented out - switch back by uncommenting)
  # model: glm-5
  # agent_base_url: "https://api.z.ai/api/anthropic" # Z.AI Anthropic-compatible endpoint

  # Subagent configuration (shared by both Claude and GLM)
  subagent_model: ./qwen3.5-9b  # Must match vLLM model ID exactly
  subagent_base_url: "http://codon-gpu-015.ebi.ac.uk:8000/v1/" # vLLM endpoint for subagent
  temperature: 0.7

# Output paths (relative paths resolve from cwd)
output_dir: results/verification/scifact_general_claim_29
notebook_path: results/verification/scifact_general_claim_29/evidence_report.ipynb
mlp_model_dir: results/ablation/models/tau_0.50_seed_42

# Logging
verbose: True

# Example usage:
# uv run python -m pkevolve.verification.evidence_programming --config experiments/test_general_claim_config.yaml --claim "A breast cancer patient's capacity to metabolize tamoxifen has no effect on treatment outcome."
