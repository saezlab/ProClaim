# ──────────────────────────────────────────────────────────────────────
# Example YAML config for evidence verification experiments.
#
# The YAML defines experiment parameters (model, thresholds, etc.).
# The claim is always provided via CLI --claim, since it varies per run.
#
# Usage:
#   uv run python -m pkevolve.verification.evidence_programming \
#       --config experiments/example_config.yaml \
#       --claim "[INSERT CLAIM HERE]"
#
# CLI flags override values in this file, e.g.:
#   --model gpt-4o --max-iterations 12
#
# Save a snapshot of the current run config for reproducibility:
#   cfg.save_yaml("experiments/run_2026_03_04.yaml")
# ──────────────────────────────────────────────────────────────────────

# Orchestration mode: "sdk" (Claude Agent SDK + nb_execute) or "repl"
mode: sdk

# Verification workflow parameters
max_iterations: 10
sufficiency_threshold: 0.80

# LLM configuration
llm:
  # Claude configuration (using official Anthropic API)
  model: claude-sonnet-4-6
  agent_base_url: "https://api.anthropic.com" # Official Anthropic API endpoint

  # GLM configuration (commented out - switch back by uncommenting)
  # model: glm-5
  # agent_base_url: "https://api.z.ai/api/anthropic" # Z.AI Anthropic-compatible endpoint

  # Subagent configuration (shared by both Claude and GLM)
  subagent_model: ./qwen3-8b  # Must match vLLM model ID exactly
  subagent_base_url: "http://codon-gpu-006.ebi.ac.uk:8000/v1/" # vLLM endpoint for subagent
  temperature: 0.7

# Output paths (relative paths resolve from cwd)
output_dir: results/verification/BCR_YWHAQ
notebook_path: results/verification/BCR_YWHAQ/evidence_report.ipynb
mlp_model_dir: results/ablation/models/tau_0.50_seed_42

# Logging
verbose: True

# uv run python -m pkevolve.verification.evidence_programming  --config experiments/example_config.yaml  --claim "BCR directly interacts with YWHAQ."