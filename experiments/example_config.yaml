# ──────────────────────────────────────────────────────────────────────
# Example YAML config for evidence verification experiments.
#
# The YAML defines experiment parameters (model, thresholds, etc.).
# The claim is always provided via CLI --claim, since it varies per run.
#
# Usage:
#   uv run python scripts/verification/demo_evidence_programming.py \
#       --config experiments/example_config.yaml \
#       --claim "[INSERT CLAIM HERE]"
#
# CLI flags override values in this file, e.g.:
#   --model gpt-4o --max-iterations 12
#
# Save a snapshot of the current run config for reproducibility:
#   cfg.save_yaml("experiments/run_2026_03_04.yaml")
# ──────────────────────────────────────────────────────────────────────

# Orchestration mode: "sdk" (Claude Agent SDK + nb_execute) or "repl"
mode: sdk

# Verification workflow parameters
max_iterations: 2
sufficiency_threshold: 0.80

# LLM configuration
llm:
  model: glm-5
  subagent_model: Qwen/Qwen3-8B
  subagent_base_url: "http://codon-gpu-007.ebi.ac.uk:8000/v1/" # vLLM endpoint for subagent
  agent_base_url: "https://api.z.ai/api/anthropic" # Anthropic-compatible endpoint for outer agent
  temperature: 0.7

# Output paths (relative paths resolve from cwd)
output_dir: results/verification/SRC_CTTN
notebook_path: results/verification/SRC_CTTN/evidence_report.ipynb

# Logging
verbose: True
