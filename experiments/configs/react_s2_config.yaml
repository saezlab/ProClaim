# ──────────────────────────────────────────────────────────────────────
# ReAct Baseline Config (S2 backend)
#
# Unconstrained agentic reasoning with tool use (Yao et al., ICLR 2023).
# The agent uses a Thought → Action → Observation loop with S2 search
# and decides on its own when to stop — no external sufficiency signal.
#
# Usage:
#   uv run python experiments/run_baselines_datasets.py \
#       --config experiments/configs/react_s2_config.yaml
#
# Prerequisites:
#   - An LLM API key recognised by litellm (e.g. ANTHROPIC_API_KEY)
#   - S2_API_KEY set for higher throughput (anonymous access is rate-limited)
#
# Any CLI flag overrides the value set here.
# ──────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────
datasets_dir: /hps/nobackup/saezrodriguez/shared_datasets/claims/datasets
datasets:
  - signor
  - connectomedb

# ── Baseline ──────────────────────────────────────────────────────────
baseline: react

# ── Model (LiteLLM format: "provider/model-id") ──────────────────────
model: anthropic/claude-sonnet-4-6

# ── Search backend ────────────────────────────────────────────────────
search_backend: s2                     # 'web' (Serper/DuckDuckGo) or 's2' (Semantic Scholar)

# Maximum number of search steps
max_steps: 10

# ── Reproducibility ───────────────────────────────────────────────────
seed: 100
repeats: 1       # temperature=0 → deterministic

# ── Sampling ──────────────────────────────────────────────────────────
limit: 0         # 0 = all claims

# ── Output ────────────────────────────────────────────────────────────
output_dir: results/baselines
