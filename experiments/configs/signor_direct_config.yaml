# ──────────────────────────────────────────────────────────────────────
# SIGNOR Evaluation Config — Direct mode (LiteLLM + bash + jupytext)
#
# Outer agent: Claude via LiteLLM (reads ANTHROPIC_API_KEY from .env)
# Subagent:    vLLM local endpoint (set via LLM_BASE_URL env var)
#
# Usage:
#   bash scripts/submit_signor_direct_batch.sh
#   bash scripts/submit_signor_direct_batch.sh --single --limit 1
# ──────────────────────────────────────────────────────────────────────

# Orchestration mode: "direct" (LiteLLM + bash + jupytext, no Jupyter kernel)
mode: direct

# Verification workflow parameters
max_iterations: 4
sufficiency_threshold: 0.80
max_turns: 10

# LLM configuration
llm:
  # Outer agent: LiteLLM model string (anthropic/ prefix → Anthropic API)
  # model: anthropic/claude-haiku-4-5-20251001
  model: anthropic/claude-sonnet-4-6

  # Subagent model: used inside bash for evidence_api calls (via vLLM)
  # Must match the vLLM model ID exactly (no ./ prefix)
  subagent_model: qwen3.5-9b

  # subagent_base_url is NOT set here — read from LLM_BASE_URL env var
  # (set dynamically by the SLURM job script from the vLLM server info file)

  temperature: 0.0
  # temperature: 1  # required when thinking is enabled
  disable_thinking: true # subagent does not use thinking
  # thinking_budget_tokens: 10000  # enable Claude extended thinking

# Sufficiency backend
sufficiency_backend: mlp
# sufficiency_backend: haiku
# sufficiency_backend: llm

# Output paths (overridden per-claim by run_signor_eval.py)
output_dir: results/signor_direct_eval

# MLP model dir (used if sufficiency_backend: mlp)
# mlp_model_dir: results/ablation/models/tau_0.50_seed_42
# mlp_model_dir: results/ablation/models/tau_0.25_seed_42
mlp_model_dir: results/ablation/models/tau_0.00_seed_42

# Prompt options
include_subclaim_examples: false

# Logging
verbose: false
