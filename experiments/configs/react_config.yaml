# ──────────────────────────────────────────────────────────────────────
# ReAct Baseline Config
#
# Unconstrained agentic reasoning with tool use (Yao et al., ICLR 2023).
# The agent uses a Thought → Action → Observation loop with web search
# and decides on its own when to stop — no external sufficiency signal.
#
# This is the "why not just use a ReAct agent?" baseline.
#
# Usage:
#   uv run python experiments/run_baselines_datasets.py \
#       --config experiments/configs/react_config.yaml
#
# Prerequisites:
#   - An LLM API key recognised by litellm (e.g. OPENAI_API_KEY)
#   - SERPER_API_KEY (optional; falls back to DuckDuckGo)
#
# Any CLI flag overrides the value set here.
# ──────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────
datasets_dir: /home/ail/workspace/claim_datasets/datasets
datasets:
  - signor
  - connectomedb

# ── Baseline ──────────────────────────────────────────────────────────
baseline: react

# ── Model (LiteLLM format: "provider/model-id") ──────────────────────
model: anthropic/claude-sonnet-4-6

# ── Search backend ────────────────────────────────────────────────────
search_backend: web                    # 'web' (Serper/DuckDuckGo) or 's2' (Semantic Scholar)

# Maximum number of search steps
max_steps: 10

# ── Reproducibility ───────────────────────────────────────────────────
seed: 100
repeats: 1       # temperature=0 → deterministic

# ── Sampling ──────────────────────────────────────────────────────────
limit: 0         # 0 = all claims
