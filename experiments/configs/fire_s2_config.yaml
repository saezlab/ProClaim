# ──────────────────────────────────────────────────────────────────────
# FIRE Baseline Config (deprecated historical preset)
#
# The original upstream FIRE integration used by this repo is web-only.
# This file is kept only so older experiment notes still resolve to a file,
# but the current baseline runner will raise if this config is used unchanged.
#
# Usage:
#   uv run python experiments/run_baselines_datasets.py \
#       --config experiments/configs/fire_s2_config.yaml
#
# Any CLI flag overrides the value set here.
# ──────────────────────────────────────────────────────────────────────

datasets_dir: /hps/nobackup/saezrodriguez/shared_datasets/claims/datasets
datasets:
  - signor
  - connectomedb

baseline: fire
model: anthropic/claude-sonnet-4-6
search_backend: s2
max_steps: 5

seed: 100
repeats: 1

limit: 0
output_dir: results/baselines