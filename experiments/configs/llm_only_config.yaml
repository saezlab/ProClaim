datasets_dir: datasets
datasets:
  - signor
  - connectomedb

baseline: llm_only

model: anthropic/claude-sonnet-4-6

seed: 100      # base seed; repeat i uses seed + i
repeats: 1     # number of independent runs (temperature=0 so variance comes from API non-determinism)

limit: 0       # 0 = all claims

output_dir: results/baselines
