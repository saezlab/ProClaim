# ──────────────────────────────────────────────────────────────────────
# Test config for evidence_programming_direct (LiteLLM + bash + jupytext)
#
# Uses Claude as both agent and subagent for a self-contained smoke test.
# In production, use a cheaper self-hosted model (vLLM) for subagents.
#
# Usage:
#   uv run python -m pkevolve.verification.evidence_programming_direct \
#       --config experiments/configs/test_direct_config.yaml \
#       --claim "BRCA1 directly activates TP53."
# ──────────────────────────────────────────────────────────────────────

# Verification workflow parameters
max_iterations: 2
sufficiency_threshold: 0.80
max_turns: 30

# LLM configuration
llm:
  # Agent model: LiteLLM model string (outer orchestrator)
  model: anthropic/claude-sonnet-4-20250514

  # Subagent model: used inside bash for evidence_api calls
  # (fact extraction, gap queries, synthesis — via make_llm / OpenAI-compatible)
  subagent_model: anthropic/claude-sonnet-4-20250514
  subagent_base_url: "https://api.anthropic.com/v1/"

  temperature: 0.2
  disable_thinking: false

# Output paths
mlp_model_dir: results/ablation/models/tau_0.50_seed_42

# Logging
verbose: true
