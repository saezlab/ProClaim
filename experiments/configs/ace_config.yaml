# ──────────────────────────────────────────────────────────────────────
# ACE Baseline Config
#
# Agentic Context Engineering — uses ACE's Generator agent with a
# claim verification playbook to classify claims.  Runs in eval_only
# mode (no training, no reflection/curation loop).
#
# Usage:
#   uv run python experiments/run_baselines_datasets.py \
#       --config experiments/configs/ace_config.yaml
#
# Prerequisites:
#   - ACE cloned at <workspace>/ace (reference only; runs in-process via litellm)
#   - An LLM API key recognised by litellm (e.g. OPENAI_API_KEY, ANTHROPIC_API_KEY)
#
# Any CLI flag overrides the value set here.
# ──────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────
datasets_dir: /home/ail/workspace/claim_datasets/datasets
datasets:
  - signor
  - connectomedb

# ── Baseline ──────────────────────────────────────────────────────────
baseline: ace

# ── Model (LiteLLM format: "provider/model-id") ──────────────────────
model: anthropic/claude-sonnet-4-6

# ── Generation ────────────────────────────────────────────────────────
max_tokens: 4096

# Optional: path to a pre-trained playbook .txt file
# playbook: /path/to/best_playbook.txt

# ── Reproducibility ───────────────────────────────────────────────────
seed: 100
repeats: 1       # ACE Generator is deterministic (temperature=0.0)

# ── Sampling ──────────────────────────────────────────────────────────
limit: 0         # 0 = all claims
