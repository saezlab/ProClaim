# ──────────────────────────────────────────────────────────────────────
# ConnectomeDB Evaluation Config — Direct mode (LiteLLM + bash + jupytext)
#
# Outer agent: Claude via LiteLLM (reads ANTHROPIC_API_KEY from .env)
# Subagent:    vLLM local endpoint (set via LLM_BASE_URL env var)
#
# Usage:
#   bash scripts/submit_connectomedb_batch.sh --reps 1
#   bash scripts/submit_connectomedb_batch.sh --single --limit 1
# ──────────────────────────────────────────────────────────────────────

mode: direct

# Verification workflow parameters
max_iterations: 4
sufficiency_threshold: 0.80
max_turns: 10

# LLM configuration
llm:
  # Outer agent: LiteLLM model string (anthropic/ prefix → Anthropic API)
  model: anthropic/claude-sonnet-4-6

  # Subagent model: used inside bash for evidence_api calls (via vLLM)
  # Must match the vLLM model ID exactly (no ./ prefix)
  subagent_model: qwen3.5-9b

  # subagent_base_url is NOT set here — read from LLM_BASE_URL env var
  # (set dynamically by the SLURM job script from the vLLM server info file)

  temperature: 0.0
  disable_thinking: true

# Sufficiency backend
sufficiency_backend: mlp

# Output paths (overridden per-claim by run_connectomedb_eval.py)
output_dir: results/connectomedb_direct_eval
mlp_model_dir: results/ablation/models/tau_0.50_seed_42

# Prompt options
include_subclaim_examples: false

# Logging
verbose: false
