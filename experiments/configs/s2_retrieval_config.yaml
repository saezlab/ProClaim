# ──────────────────────────────────────────────────────────────────────
# S2 Retrieval Baseline Config
#
# Fixed-k RAG: search Semantic Scholar with the raw claim, retrieve
# top-k abstracts, pass them to the LLM in a single call.
#
# Usage:
#   uv run python experiments/run_baselines_datasets.py \
#       --config experiments/configs/s2_retrieval_config.yaml
#
# Prerequisites:
#   - S2_API_KEY set for higher throughput (anonymous access is rate-limited)
#   - ANTHROPIC_API_KEY (or matching provider key) set
#
# Any CLI flag overrides the value set here.
# ──────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────
datasets_dir: /home/ail/workspace/claim_datasets/datasets
datasets:
  - signor
  - connectomedb

# ── Baseline ──────────────────────────────────────────────────────────
baseline: s2_retrieval

# ── Model & retrieval ─────────────────────────────────────────────────
model: anthropic/claude-sonnet-4-6   # LiteLLM model string
top_k: 5                              # number of S2 abstracts to retrieve

# ── Reproducibility ───────────────────────────────────────────────────
seed: 100      # base seed; repeat i uses seed + i
repeats: 1     # deterministic retrieval + temperature=0 → 1 repeat usually sufficient

# ── Sampling ──────────────────────────────────────────────────────────
limit: 0       # 0 = all claims

# ── Output ────────────────────────────────────────────────────────────
output_dir: results/baselines
