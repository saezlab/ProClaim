# ──────────────────────────────────────────────────────────────────────
# Ligand-Receptor Original Form Config — MLP sufficiency
#
# Same claims in original dataset form, but with MLP sufficiency backend.
# ──────────────────────────────────────────────────────────────────────

max_iterations: 4
sufficiency_threshold: 0.80
max_turns: 30

llm:
  model: anthropic/claude-sonnet-4-20250514
  subagent_model: Qwen/Qwen3-8B
  subagent_base_url: "http://localhost:8000/v1/"
  temperature: 0.2
  disable_thinking: true

sufficiency_backend: mlp
mlp_model_dir: results/ablation/models/tau_0.50_seed_42

output_dir: results/ligand_receptor_eval_original_mlp
verbose: true
