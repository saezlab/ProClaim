# ──────────────────────────────────────────────────────────────────────
# Ligand-Receptor Original Form Config
#
# Same as ligand_receptor_direct_config.yaml but with:
# - sufficiency_backend: haiku (as requested)
# - Claims will use original dataset form with context boilerplate
#
# Usage:
#   bash scripts/run_ligand_receptor_original_form.sh
# ──────────────────────────────────────────────────────────────────────

# Verification workflow parameters
max_iterations: 4
sufficiency_threshold: 0.80
max_turns: 30

# LLM configuration
llm:
  # Agent model: Claude Sonnet via LiteLLM
  model: anthropic/claude-sonnet-4-20250514

  # Subagent model: Qwen3-8B on local vLLM
  subagent_model: Qwen/Qwen3-8B
  subagent_base_url: "http://localhost:8000/v1/"

  temperature: 0.2
  disable_thinking: true

# Sufficiency backend
sufficiency_backend: haiku

# Output paths
output_dir: results/ligand_receptor_eval_original

# Logging
verbose: true
