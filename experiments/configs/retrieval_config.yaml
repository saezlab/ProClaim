datasets_dir: datasets
datasets:
  - signor
  - connectomedb

baseline: retrieval

search_backend: s2                     # 'web' or 's2' (Semantic Scholar)

model: anthropic/claude-sonnet-4-6   # LiteLLM model string
top_k: 5                              # number of S2 abstracts to retrieve

seed: 100      # base seed; repeat i uses seed + i
repeats: 1     # deterministic retrieval + temperature=0 → 1 repeat usually sufficient

limit: 0       # 0 = all claims

temperature: 0.0

output_dir: results/baselines
